# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        run: pytest --cov . --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}  # Добавьте токен в репозитории secrets

  build:
    runs-on: ubuntu-latest
    needs: test  # Строим только если тесты прошли
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t matchup .
      - name: Test Docker run
        run: docker run -d -p 5000:5000 matchup && sleep 5 && curl -f http://localhost:5000/  # Простая проверка

  deploy:  # Опционально: деплой на Heroku/DigitalOcean (добавьте при необходимости)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: echo "Add deploy script here (e.g., heroku push)"