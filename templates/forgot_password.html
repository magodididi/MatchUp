<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/forgot.css">
</head>
<body>

<div class="reset-container">
    <h2>Забыли пароль?</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="errors" role="alert">
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post">
        <div class="form-group">
            <input type="email" id="email" name="email" placeholder="example@mail.com" required 
                   aria-required="true" aria-describedby="emailHint">
            <small id="emailHint" class="hint">На этот email придет ссылка для сброса пароля</small>
        </div>
        <button type="submit">Отправить ссылку</button>
    </form>

    <a href="/login">Назад ко входу</a>
</div>

<style>
    .form-group {
        width: 100%;
        margin-bottom: 20px;
        text-align: left;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
        font-size: 15px;
    }
    
    .hint {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
        display: block;
    }
    
    .errors {
        list-style: none;
        padding: 0;
        margin: 0 0 20px 0;
    }
    
    .errors li {
        background: #ffd6d6;
        color: #ff1f3c;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 14px;
    }
</style>

</body>
</html>
