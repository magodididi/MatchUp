<!DOCTYPE html>
<html>
<head>
    <title>Вход</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(135deg, #ffe6e6, #ffb3b3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #ff3b57;
            font-size: 28px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff3b57;
            outline: none;
            box-shadow: 0 0 8px rgba(255,59,87,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 50px;
            background: #ff3b57;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        button:hover {
            background: #ff1f3c;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        a {
            color: #ff3b57;
            font-size: 14px;
            margin-top: 10px;
            transition: 0.3s;
        }

        a:hover {
            opacity: 0.8;
        }

        .errors {
            list-style: none;
            padding: 0;
            margin: 10px 0 20px 0;
            width: 100%;
        }

        .errors li {
            background: #ffd6d6;
            color: #ff1f3c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-5px);}
            to {opacity: 1; transform: translateY(0);}
        }

        /* Дополнительная адаптивность */
        @media(max-width: 450px){
            .container { padding: 30px 20px; }
            h2 { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Вход</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="errors">
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <input name="login" placeholder="Логин" required>
        <input name="password" type="password" placeholder="Пароль" required>
        <button>Войти</button>
        <a href="{{ url_for('auth.forgot_password') }}">Забыли пароль?</a>
    </form>
    <a href="{{ url_for('auth.register') }}">Регистрация</a>
</div>

</body>
</html>
