<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/register.css">
</head>
<body>

<div class="container">
    <h2>Регистрация</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="errors" role="alert">
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post" id="registerForm">
        <div class="form-group">
            <input type="text" id="login" name="login" placeholder="example12" required 
                   aria-required="true" aria-describedby="loginHint">
            <small id="loginHint" class="hint">От 3 до 20 символов</small>
        </div>

        <div class="form-group">
            <input type="email" id="email" name="email" placeholder="example@mail.com" required 
                   aria-required="true" aria-describedby="emailHint">
            <small id="emailHint" class="hint">Введите действующий email</small>
        </div>

        <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required 
                   aria-required="true" aria-describedby="passwordHint" 
                   pattern="(?=.*\d)(?=.*[a-zA-Z]).{6,}" title="Пароль должен содержать буквы и цифры">
            <small id="passwordHint" class="hint">буквы, цифры и символы</small>
        </div>

        <div class="form-group">
            <input type="password" id="confirm_password" name="confirm_password" 
                   placeholder="Повторите пароль" required aria-required="true">
            <div id="passwordMatchError" class="error-message" style="display: none; color: #ff4757;">
                Пароли не совпадают
            </div>
        </div>

        <button type="submit" id="submitBtn">Зарегистрироваться</button>
    </form>
    
    <a href="{{ url_for('auth.login') }}">Уже есть аккаунт? Войти</a>
</div>

<script>
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm_password');
    const matchError = document.getElementById('passwordMatchError');
    const submitBtn = document.getElementById('submitBtn');
    const form = document.getElementById('registerForm');

    function validatePasswords() {
        if (password.value && confirmPassword.value) {
            if (password.value !== confirmPassword.value) {
                matchError.style.display = 'block';
                confirmPassword.setAttribute('aria-invalid', 'true');
                return false;
            } else {
                matchError.style.display = 'none';
                confirmPassword.setAttribute('aria-invalid', 'false');
                return true;
            }
        }
        return true;
    }

    password.addEventListener('input', validatePasswords);
    confirmPassword.addEventListener('input', validatePasswords);

    form.addEventListener('submit', function(e) {
        if (!validatePasswords()) {
            e.preventDefault();
        }
    });

    password.addEventListener('input', function() {
        const val = this.value;
        let strength = 0;
        
        if (val.length >= 6) strength++;
        if (val.match(/[a-z]/)) strength++;
        if (val.match(/[A-Z]/)) strength++;
        if (val.match(/\d/)) strength++;
        if (val.match(/[^a-zA-Z0-9]/)) strength++;
        
        const strengthBar = document.createElement('div');
        strengthBar.className = 'password-strength';
        
        const oldBar = this.parentNode.querySelector('.password-strength');
        if (oldBar) oldBar.remove();
        
        if (val.length > 0) {
            strengthBar.innerHTML = '<div class="strength-meter"><div class="strength-fill" style="width: ' + (strength * 20) + '%"></div></div>';
            this.parentNode.appendChild(strengthBar);
        }
    });
</script>

<style>
    .form-group {
        margin-bottom: 15px;
        text-align: left;
        width: 100%;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
        color: #333;
    }
    
    .hint {
        font-size: 12px;
        color: #666;
        margin-top: 3px;
        display: block;
    }
    
    .error-message {
        font-size: 13px;
        margin-top: 5px;
    }
    
    .password-strength {
        margin-top: 5px;
    }
    
    .strength-meter {
        height: 4px;
        background: #eee;
        border-radius: 2px;
        overflow: hidden;
    }
    
    .strength-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff4757, #ff6b81);
        transition: width 0.3s;
    }
    
    @media (max-width: 450px) {
        .form-group label {
            font-size: 14px;
        }
    }
</style>

</body>
</html>
